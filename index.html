<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DentalPost — AI Content Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>DentalPost</h1>
    <p>AI-powered social media content for dental offices</p>
  </header>

  <main>
    <section class="card">
      <h2>What would you like to create?</h2>

      <div class="form-group">
        <label for="content-type">Content Type</label>
        <select id="content-type" onchange="showFields()">
          <option value="">— Select a type —</option>
          <option value="before-after">Before &amp; After Caption</option>
          <option value="educational">Educational Post</option>
          <option value="promotional">Promotional Post</option>
          <option value="seasonal">Seasonal Content</option>
        </select>
      </div>

      <!-- Before & After -->
      <div id="fields-before-after" class="field-group hidden">
        <div class="form-group">
          <label for="procedure">Procedure Type</label>
          <select id="procedure">
            <option value="">— Select —</option>
            <option>Implant Restoration</option>
            <option>Veneers</option>
            <option>Teeth Whitening</option>
            <option>Invisalign</option>
            <option>Braces</option>
            <option>Dental Bonding</option>
            <option>Crown</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ba-tone">Tone</label>
          <select id="ba-tone">
            <option>Professional &amp; Welcoming</option>
            <option>Warm &amp; Personal</option>
            <option>Friendly &amp; Casual</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ba-focus">What made this result special?</label>
          <textarea id="ba-focus" placeholder="e.g. Really improved the patient's quality of life and confidence"></textarea>
        </div>
      </div>

      <!-- Educational -->
      <div id="fields-educational" class="field-group hidden">
        <div class="form-group">
          <label for="edu-topic">Topic</label>
          <select id="edu-topic">
            <option value="">— Select —</option>
            <option>Flossing</option>
            <option>Fluoride</option>
            <option>Gum Disease</option>
            <option>Teeth Grinding</option>
            <option>Teeth Whitening</option>
            <option>Dental Implants</option>
            <option>Children's Dental Health</option>
            <option>Invisalign</option>
            <option>Root Canal Myths</option>
            <option>Oral Cancer Awareness</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edu-tone">Tone</label>
          <select id="edu-tone">
            <option>Professional &amp; Informative</option>
            <option>Friendly &amp; Approachable</option>
            <option>Fun &amp; Casual</option>
          </select>
        </div>
        <div class="form-group">
          <label for="edu-format">Post Format</label>
          <select id="edu-format">
            <option>Fact-based</option>
            <option>Myth vs. Truth</option>
            <option>Tips List</option>
            <option>Q&amp;A</option>
          </select>
        </div>
      </div>

      <!-- Promotional -->
      <div id="fields-promotional" class="field-group hidden">
        <div class="form-group">
          <label for="promo-type">Promotion Type</label>
          <select id="promo-type">
            <option value="">— Select —</option>
            <option>Teeth Whitening Special</option>
            <option>Invisalign Offer</option>
            <option>New Patient Special</option>
            <option>Free Consultation</option>
            <option>Seasonal Promotion</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="promo-details">Offer Details</label>
          <textarea id="promo-details" placeholder="e.g. $99 whitening through December 31st"></textarea>
        </div>
        <div class="form-group">
          <label for="promo-tone">Tone</label>
          <select id="promo-tone">
            <option>Professional &amp; Trustworthy</option>
            <option>Excited &amp; Energetic</option>
            <option>Warm &amp; Inviting</option>
          </select>
        </div>
        <div class="form-group">
          <label for="promo-urgency">Urgency</label>
          <select id="promo-urgency">
            <option>Low — ongoing offer</option>
            <option>Medium — limited time</option>
            <option>High — ending soon</option>
          </select>
        </div>
      </div>

      <!-- Seasonal -->
      <div id="fields-seasonal" class="field-group hidden">
        <div class="form-group">
          <label for="season">Month or Holiday</label>
          <select id="season">
            <option value="">— Select —</option>
            <option>January — New Year</option>
            <option>February — Valentine's Day</option>
            <option>March — Spring</option>
            <option>April — Oral Health Month</option>
            <option>May — Mother's Day</option>
            <option>June — Summer</option>
            <option>July — Independence Day</option>
            <option>August — Back to School</option>
            <option>September — Fall</option>
            <option>October — Halloween</option>
            <option>November — Thanksgiving</option>
            <option>December — Holidays</option>
          </select>
        </div>
        <div class="form-group">
          <label for="season-angle">Content Angle</label>
          <select id="season-angle">
            <option>Holiday tie-in</option>
            <option>Health reminder</option>
            <option>Fun &amp; festive</option>
            <option>Awareness month</option>
          </select>
        </div>
        <div class="form-group">
          <label for="season-tone">Tone</label>
          <select id="season-tone">
            <option>Warm &amp; Friendly</option>
            <option>Festive &amp; Fun</option>
            <option>Informational</option>
          </select>
        </div>
      </div>

      <button id="generate-btn" class="hidden" onclick="generateContent()">
        Generate Captions
      </button>
    </section>

    <!-- Results -->
    <section id="results" class="hidden">
      <h2>Your 3 Caption Options</h2>
      <p class="subtitle">Click any caption to copy it.</p>
      <div id="captions-container"></div>
      <button class="secondary" onclick="resetForm()">Generate Again</button>
    </section>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Generating your captions...</p>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
